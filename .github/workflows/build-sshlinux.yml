name: Build SSHLinux ramdisk (macOS)

on:
  workflow_dispatch:
    inputs:
      ios_version:
        description: iOS version used to build the ramdisk (for example 15.6.1)
        required: true
        type: string
      product:
        description: Device identifier returned by irecovery (for example iPhone10,6)
        required: true
        type: string
      model:
        description: MODEL value returned by irecovery -q for the target device
        required: true
        type: string
      cpid:
        description: CPID value returned by irecovery -q (for example 0x8015)
        required: true
        type: string
      shsh_url:
        description: Public URL to the matching .shsh/.shsh2 ticket
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    env:
      IOS_VERSION: ${{ inputs.ios_version }}
      DEVICE_ID: ${{ inputs.product }}
      DEVICE_MODEL: ${{ inputs.model }}
      DEVICE_CPID: ${{ inputs.cpid }}
      SHSH_URL: ${{ inputs.shsh_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build SSH ramdisk on macOS
        run: |
          chmod +x ci/build-sshramdisk-macos.sh
          ./ci/build-sshramdisk-macos.sh

      - name: Verify ramdisk
        run: |
          set -e
          test -s sshramdisk/iBSS.img4
          test -s sshramdisk/iBEC.img4
          test -s sshramdisk/logo.img4
          test -s sshramdisk/ramdisk.img4
          test -s sshramdisk/devicetree.img4
          test -s sshramdisk/kernelcache.img4
          test -s sshramdisk/version.txt
          ls -lh sshramdisk/

      - name: Package ramdisk
        run: |
          mkdir -p release
          tar -czf "release/sshramdisk-${DEVICE_ID}.tar.gz" \
            sshramdisk

      - name: Publish latest ramdisk for this device
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "ramdisk-${{ inputs.product }}"
          name: "SSH ramdisk - ${{ inputs.product }}"
          body: |
            Generated by the macOS SSHRD-compatible builder.

            Device: ${{ inputs.product }}
            Model: ${{ inputs.model }}
            CPID: ${{ inputs.cpid }}
            iOS: ${{ inputs.ios_version }}

            The Linux launcher automatically downloads this release when its local sshramdisk is missing.
          files: release/sshramdisk-${{ inputs.product }}.tar.gz
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: false
