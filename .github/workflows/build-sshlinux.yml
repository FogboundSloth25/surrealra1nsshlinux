name: Build SSHLinux ramdisk (macOS)

run-name: SSHLinux ramdisk ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Unique request ID generated by sshlinux.sh
        required: true
        type: string
      ios_version:
        description: Target iOS version
        required: true
        type: string
      product:
        description: PRODUCT from irecovery -q
        required: true
        type: string
      model:
        description: MODEL from irecovery -q
        required: true
        type: string
      cpid:
        description: CPID from irecovery -q
        required: true
        type: string
      shsh_base64:
        description: Base64-encoded local SHSH/SHSH2 ticket
        required: true
        type: string

permissions:
  contents: read

env:
  IOS_VERSION: ${{ inputs.ios_version }}
  DEVICE_ID: ${{ inputs.product }}
  DEVICE_MODEL: ${{ inputs.model }}
  DEVICE_CPID: ${{ inputs.cpid }}
  SHSH_BASE64: ${{ inputs.shsh_base64 }}

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode SHSH ticket
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci/work-sshrd-input
          printf '%s' "$SHSH_BASE64" | base64 --decode > "ci/work-sshrd-input/${DEVICE_CPID}.shsh"
          test -s "ci/work-sshrd-input/${DEVICE_CPID}.shsh"
          echo "[*] SHSH ticket received (${DEVICE_CPID})"

      - name: Build SSH ramdisk on macOS
        shell: bash
        env:
          LOCAL_SHSH: ${{ github.workspace }}/ci/work-sshrd-input/${{ inputs.cpid }}.shsh
        run: |
          chmod +x ci/build-sshramdisk-macos.sh
          ./ci/build-sshramdisk-macos.sh

      - name: Verify ramdisk
        shell: bash
        run: |
          set -euo pipefail
          for f in iBSS.img4 iBEC.img4 logo.img4 ramdisk.img4 devicetree.img4 kernelcache.img4 version.txt; do
            test -s "sshramdisk/$f"
          done
          ls -lh sshramdisk/

      - name: Package ramdisk
        shell: bash
        run: |
          mkdir -p release
          tar -czf "release/sshramdisk-${DEVICE_ID}.tar.gz" sshramdisk

      - name: Upload ramdisk artifact
        uses: actions/upload-artifact@v4
        with:
          name: sshramdisk-${{ inputs.product }}
          path: release/sshramdisk-${{ inputs.product }}.tar.gz
          if-no-files-found: error
          retention-days: 7